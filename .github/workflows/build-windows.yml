name: Build Windows executables

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build ocr_worker.exe
        run: |
          pyinstaller --onefile --name ocr_worker ocr_worker.py

      - name: Build boletin_scraper.exe
        run: |
          pyinstaller --onefile --name boletin_scraper main.py

      - name: Package release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\boletin_scraper.exe release\
          Copy-Item dist\ocr_worker.exe release\
          if (Test-Path config.env) { Copy-Item config.env release\ }
          New-Item -ItemType Directory -Force -Path release\logs | Out-Null
          New-Item -ItemType Directory -Force -Path release\tmp  | Out-Null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoletinScraper-Windows
          path: release